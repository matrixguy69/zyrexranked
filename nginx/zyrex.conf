# ============================================================
#  Nginx config for Zyrex Ranked
#  Place in: /etc/nginx/sites-available/zyrex-api
#  Then: ln -s /etc/nginx/sites-available/zyrex-api /etc/nginx/sites-enabled/
# ============================================================

# ── API server (api.zyrex.gg) ────────────────────────────────────────────────
server {
    listen 80;
    server_name api.zyrex.gg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.zyrex.gg;

    # SSL — replace with your cert paths (use certbot for free Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.zyrex.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zyrex.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req zone=api burst=60 nodelay;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # CORS preflight
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://zyrex.gg";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-API-Secret";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── Website server (zyrex.gg) ────────────────────────────────────────────────
server {
    listen 80;
    server_name zyrex.gg www.zyrex.gg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zyrex.gg www.zyrex.gg;

    ssl_certificate     /etc/letsencrypt/live/zyrex.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zyrex.gg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js static assets (long-lived cache)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js app
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
